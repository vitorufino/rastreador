<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- envia só a origem (https://vitorufino.github.io) — o OpenStreetMap exige isso para liberar os mapas -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Segurança: o navegador só carrega código destes endereços e só conversa com o Supabase do projeto -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' https://kojsvzubedofepcvqrjp.supabase.co wss://kojsvzubedofepcvqrjp.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#0b6fb3">
<!-- versão do site: trocada a cada publicação (publicar_site.py); o site se recarrega sozinho quando muda -->
<meta name="versao" content="20261111-075006">
<title>Rastreador</title>
<!-- versões travadas + integrity: se o arquivo da CDN for alterado, o navegador recusa -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<link rel="stylesheet" href="style.css?v=20261111-075006">
</head>
<body>

<!-- Tela de login -->
<section id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <h1>Rastreador</h1>
    <p class="muted">Entre para ver a rota.</p>
    <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
    <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Entrar</button>
    <p id="login-erro" class="erro" role="alert"></p>
  </form>
</section>

<!-- App -->
<div id="app" class="app" hidden>
  <header class="topo">
    <div class="titulo">
      <h1>Rastreador</h1>
    </div>
    <div class="topo-acoes">
      <select id="carro" aria-label="Carro"><option value="">Todos os carros</option></select>
      <button class="btn icon" id="dia-ant" title="Dia anterior" aria-label="Dia anterior">‹</button>
      <select id="dia" aria-label="Dia"></select>
      <button class="btn icon" id="dia-prox" title="Próximo dia" aria-label="Próximo dia">›</button>
      <button class="btn" id="sair">Sair</button>
    </div>
  </header>

  <div class="status" id="status">
    <span id="st-carros" class="carros"></span>
    <span id="st-consulta">—</span>
    <span id="st-vivo" class="vivo" title="Atualização ao vivo">● ao vivo</span>
  </div>

  <main class="corpo">
    <div id="map" class="mapa"></div>
    <aside class="painel">
      <section class="card">
        <h2>Exportar o dia</h2>
        <div class="linha">
          <a class="btn primary" id="gmaps" target="_blank" rel="noopener">Abrir no Google Maps</a>
          <button class="btn" data-fmt="kml">KML</button>
          <button class="btn" data-fmt="geojson">GeoJSON</button>
          <button class="btn" data-fmt="gpx">GPX</button>
          <button class="btn" data-fmt="csv">CSV</button>
        </div>
        <p class="muted small" id="nota-url"></p>
      </section>
      <section class="card">
        <h2>Pontos <span id="contagem" class="muted"></span></h2>
        <div class="lista" id="lista"></div>
      </section>
      <section class="card">
        <h2>Últimas consultas</h2>
        <div class="lista curta" id="consultas"></div>
      </section>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"
        integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
<script src="config.js?v=20261111-075006"></script>
<script src="exportar.js?v=20261111-075006"></script>
<script src="app.js?v=20261111-075006"></script>
</body>
</html>
